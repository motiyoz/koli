# Keeps the free Supabase project from pausing after a week without activity.
# Reads the project URL and public key from config.js, and does nothing until they are filled in.
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]*' config.js || true)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]*' config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not configured yet, skipping."; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered $code"
